# Автотест Android-версии в эмуляторе: приложение ставится, загружает модель Qwen3 1.7B Q4_0,
# отвечает на тестовые вопросы. Логи, ответы и скриншоты публикуются в Releases (selftest-<номер>).

name: Android self-test (emulator)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android-selftest.yml"]

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install NDK, CMake, SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Get llama.cpp and Tesseract data
        run: |
          git clone --depth 1 --branch b11380 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
          mkdir -p app/src/main/assets/tessdata
          curl -sSL -o app/src/main/assets/tessdata/rus.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata
          curl -sSL -o app/src/main/assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata

      - name: Build x86_64 APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pabis=x86_64 --no-daemon -q

      - name: Cache model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: android/model.gguf
          key: qwen3-1.7b-q4_0

      - name: Download model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: curl -sSL -o model.gguf https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_0.gguf && ls -lh model.gguf

      - name: Run self-test in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          disk-size: 8G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: bash ci/selftest.sh

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd selftest-out || exit 0
          gh release create "selftest-${{ github.run_number }}" * \
            --title "Автотест ${{ github.run_number }}" --notes "Результаты автотеста в эмуляторе." --prerelease

  # Проверка движка на ARM: (1) на настоящем ARM-процессоре сервера,
  # (2) в эмуляции старого ядра Cortex-A53 (ARMv8.0, без dotprod) — как в бюджетных телефонах.
  arm-engine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Cache model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: model.gguf
          key: qwen3-1.7b-q4_0-arm

      - name: Download model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: curl -sSL -o model.gguf https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_0.gguf

      - name: Build and run
        shell: bash
        run: |
          set +e
          W="$GITHUB_WORKSPACE"
          mkdir -p "$W/arm-out"
          (
            sudo apt-get update -q && sudo apt-get install -y -q cmake build-essential clang libomp-dev qemu-user
            git clone --depth 1 --branch b11380 https://github.com/ggml-org/llama.cpp "$W/llama.cpp"
            cd "$W/llama.cpp"
            CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF \
              -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_CPU_KLEIDIAI=ON -DGGML_OPENMP=ON \
              -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_EXAMPLES=ON
            cmake --build build -j 4 --target llama-simple
          ) > "$W/arm-out/build.txt" 2>&1
          lscpu > "$W/arm-out/cpu.txt"
          cd "$W/llama.cpp/build/bin" || exit 0
          timeout 600 ./llama-simple -m "$W/model.gguf" -n 48 "Столица Франции — это" > "$W/arm-out/native.txt" 2>&1
          echo "EXIT $?" >> "$W/arm-out/native.txt"
          timeout 2400 qemu-aarch64 -cpu cortex-a53 ./llama-simple -m "$W/model.gguf" -n 8 "Столица Франции — это" > "$W/arm-out/cortex-a53.txt" 2>&1
          echo "EXIT $?" >> "$W/arm-out/cortex-a53.txt"
          tail -15 "$W/arm-out/native.txt" "$W/arm-out/cortex-a53.txt"
          exit 0

      - name: Publish ARM results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "selftest-arm-${{ github.run_number }}" arm-out/* -R "${{ github.repository }}" \
            --title "Тест движка на ARM ${{ github.run_number }}" --notes "llama.cpp b11380 на ARM CPU и в эмуляции Cortex-A53." --prerelease
